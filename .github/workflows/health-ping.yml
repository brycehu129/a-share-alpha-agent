name: 外部心跳（服务器健康）

# 唯一独立于服务器本身的一环：服务器整个挂了，它自己的健康检查发不出告警；
# 这里从 GitHub 一侧定期访问不需要登录的 /health/deep，返回非 200（stale / critical / 连不上）就让这次运行失败，
# GitHub 会给你发失败邮件。/health/deep 只返回 ok/stale/critical，不含任何细节，也不需要任何密钥。
#
# 局限：GitHub 的定时任务可能延迟几分钟到几十分钟；仓库 60 天没有任何活动时 GitHub 会自动停用定时任务。
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 访问 /health/deep
        run: |
          # -k：服务器用自签名证书；这里只做存活探测，不传输任何敏感信息。
          code=$(curl -sk --max-time 25 -o /tmp/body -w '%{http_code}' https://64.188.22.227:8080/health/deep || echo 000)
          echo "HTTP $code: $(cat /tmp/body 2>/dev/null | head -c 100)"
          test "$code" = "200"

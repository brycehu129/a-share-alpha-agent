name: A股盘前与收盘数据整理
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['server/report_status.py', 'server/report_dispatch.py']
  schedule:
    - cron: '10 23 * * 0-4'
    - cron: '40 0 * * 1-5'
    - cron: '35 7 * * 1-5'
    - cron: '20 10 * * 1-5'
    # Recovery checks; GitHub scheduling remains best effort.
    - cron: '17 0-12 * * 1-5'
permissions:
  contents: read
concurrency:
  group: market-report-history
  cancel-in-progress: false
jobs:
  daily:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      REPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      REPORT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: market-data
          path: .history
      - name: 按实际时间检查待补报告
        id: dispatch
        run: python3 server/report_dispatch.py --history .history
      - name: 验证程序
        if: steps.dispatch.outputs.run == 'true'
        run: python3 -m unittest discover -s server -p 'test_*.py'
      - name: 发布运行中状态
        if: steps.dispatch.outputs.run == 'true'
        run: bash server/publish_report_status.sh start
      - name: 补齐历史与交易日历
        if: steps.dispatch.outputs.run == 'true'
        continue-on-error: true
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          XIAODEFA_TOKEN: ${{ secrets.XIAODEFA_TOKEN }}
        run: python3 -u server/tushare_sync.py --history .history --run-id "$REPORT_ID"
      - name: 核验是否休市
        if: steps.dispatch.outputs.run == 'true'
        id: gate
        run: python3 server/session_brief.py --history .history --gate-only
      - name: 更新市场行情
        if: steps.gate.outputs.collect == 'true' && env.REPORT_SLOT != 'prepare' && steps.dispatch.outputs.run == 'true'
        continue-on-error: true
        run: python3 -u server/report_pipeline.py --history .history --run-id "$REPORT_ID"
      - name: 更新行业与样本强度
        if: steps.gate.outputs.collect == 'true' && env.REPORT_SLOT != 'prepare' && steps.dispatch.outputs.run == 'true'
        continue-on-error: true
        run: python3 -u server/research_pipeline.py --history .history --run-id "$REPORT_ID"
      - name: 生成历史窗口分析
        if: steps.dispatch.outputs.run == 'true'
        continue-on-error: true
        run: python3 server/tushare_analysis.py --history .history --run-id "$REPORT_ID"
      - name: 转换全清单日线与复权因子
        if: steps.dispatch.outputs.run == 'true'
        run: python3 -u server/tushare_bridge.py --history .history --run-id "$REPORT_ID"
      - name: 更新基准日线
        if: steps.gate.outputs.collect == 'true' && env.REPORT_SLOT != 'prepare' && steps.dispatch.outputs.run == 'true'
        continue-on-error: true
        run: python3 -u server/alpha_data.py --history .history --run-id "$REPORT_ID" --benchmark-only
      - name: 生成候选及账户报告
        if: steps.gate.outputs.collect == 'true' && env.REPORT_SLOT != 'prepare' && steps.dispatch.outputs.run == 'true'
        run: python3 -u server/alpha_engine.py --history .history --run-id "$REPORT_ID"
      - name: 整理日报并导出网页数据
        if: steps.dispatch.outputs.run == 'true'
        run: |
          python3 server/session_brief.py --history .history --run-id "$REPORT_ID"
          python3 server/dashboard_export.py --history .history
      - name: 保存数据与报告
        if: steps.dispatch.outputs.run == 'true'
        working-directory: .history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Archive scheduled data brief $REPORT_ID"
          git push origin HEAD:market-data
      - name: 发布最终运行状态
        if: always() && steps.dispatch.outputs.run == 'true'
        env:
          FINAL_JOB_STATUS: ${{ job.status }}
        run: bash server/publish_report_status.sh finish "$FINAL_JOB_STATUS"
      - name: 展示本次整理报告
        if: always() && steps.dispatch.outputs.run == 'true'
        run: |
          if [ -f ".history/briefs/$REPORT_ID.md" ]; then
            cat ".history/briefs/$REPORT_ID.md" >> "$GITHUB_STEP_SUMMARY"
          fi

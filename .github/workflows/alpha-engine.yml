name: Alpha候选与虚拟账户
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['server/data_source_policy.py', 'server/tushare_bridge.py']
permissions:
  contents: read
concurrency:
  group: market-report-history
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    env:
      REPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s server -p 'test_*.py'
      - run: python3 -m pip install baostock==0.9.3
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: market-data
          path: .history
      - name: 转换已校验日线与复权因子
        run: python3 -u server/tushare_bridge.py --history .history --run-id "$REPORT_ID"
      - name: 更新基准日线
        continue-on-error: true
        run: python3 -u server/alpha_data.py --history .history --run-id "$REPORT_ID" --benchmark-only
      - name: 补充独立日线源
        # A hung external SDK is bounded independently of the overall workflow.
        run: timeout --kill-after=10s 2160 python3 -u server/alpha_baostock.py --history .history --run-id "$REPORT_ID"
        continue-on-error: true
      - name: 生成候选及账户报告
        run: python3 -u server/alpha_engine.py --history .history --run-id "$REPORT_ID"
      - name: 导出日报与网页
        run: |
          python3 server/session_brief.py --history .history --run-id "$REPORT_ID"
          python3 server/dashboard_export.py --history .history
      - name: 提交账本与数据
        working-directory: .history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Archive Alpha research $REPORT_ID"
          git push origin HEAD:market-data
      - name: 本次结果
        if: always()
        run: |
          if [ -f ".history/agent/$REPORT_ID.md" ]; then
            cat ".history/agent/$REPORT_ID.md" >> "$GITHUB_STEP_SUMMARY"
          fi

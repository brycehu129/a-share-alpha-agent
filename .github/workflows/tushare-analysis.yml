name: Tushare离线研究报告
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'server/tushare_analysis.py'
      - 'server/test_tushare_analysis.py'
      - '.github/workflows/tushare-analysis.yml'
permissions:
  contents: read
concurrency:
  group: market-report-history
  cancel-in-progress: false
jobs:
  report:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      data_commit: ${{ steps.save.outputs.data_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s server -p 'test_tushare_*.py' -v
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: market-data
          path: .history
      - name: 生成离线报告
        env:
          REPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 server/tushare_analysis.py --history .history --run-id "$REPORT_ID"
      - name: 保存报告
        id: save
        working-directory: .history
        env:
          REPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tushare_analysis/
          git commit -m "Save offline Tushare analysis $REPORT_ID"
          git push origin HEAD:market-data
          echo "data_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.report.outputs.data_commit }}
          path: .history
          persist-credentials: false
      - name: 恢复数据并重算报告
        env:
          REPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 server/tushare_analysis.py --history .history --run-id "$REPORT_ID" --verify-only

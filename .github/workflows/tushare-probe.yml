name: Tushare连接与权限测试
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'server/tushare_probe.py'
      - 'server/test_tushare_probe.py'
      - '.github/workflows/tushare-probe.yml'
permissions:
  contents: read
concurrency:
  group: market-report-history
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s server -p 'test_tushare_probe.py' -v
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: market-data
          path: .history
      - name: 测试官方接口
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          XIAODEFA_TOKEN: ${{ secrets.XIAODEFA_TOKEN }}
          REPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -u server/tushare_probe.py --history .history --run-id "$REPORT_ID"
      - name: 保存权限与数据样本报告
        working-directory: .history
        env:
          REPORT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "tushare/$REPORT_ID.json" "tushare/$REPORT_ID.md" tushare/README.md
          git commit -m "Save Tushare permission probe $REPORT_ID"
          git push origin HEAD:market-data
